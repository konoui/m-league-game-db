name: Validate SQL Queries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6

      - name: Check query-examples are up to date
        run: uv run scripts/render.py --check

      - name: Download latest database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --pattern 'database.zip' --pattern 'duckdb.zip'
          unzip -o database.zip
          unzip -o duckdb.zip

      # SQLite と DuckDB の両方で実行し、固定した版の DB での結果（result.json）とも比べる。
      # --strict: 検査できなかった段階があれば失敗にする
      - name: Validate queries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run scripts/validate.py check --strict
