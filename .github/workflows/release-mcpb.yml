name: Release MCP Extension

# mcpb-v<X.Y.Z> のタグを push すると、Claude Desktop の拡張機能（.mcpb）をビルドしてリリースに載せる。
# mcp-server/ を変更した PR では、ビルドと動作確認だけを行う。
on:
  push:
    tags: ["mcpb-v*"]
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/release-mcpb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Decide version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#mcpb-v}"
          else
            version="0.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build .mcpb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./mcp-server/build_mcpb.sh

      # 展開した .mcpb を、同梱の uv.lock の依存で起動できるか、最新の DB に対してツールが動くかを確かめる
      - name: Smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # クエリ例の取得を、このコミットの zip で確かめる（API の回数制限を避けるため SHA の問い合わせはしない）
          EXAMPLES_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh release download --pattern duckdb.zip --dir "$RUNNER_TEMP/db"
          unzip -o -q "$RUNNER_TEMP/db/duckdb.zip" database.duckdb -d "$RUNNER_TEMP/db"
          unzip -q mcp-server/dist/m-league-db.mcpb -d "$RUNNER_TEMP/mcpb"
          MLEAGUE_DB="$RUNNER_TEMP/db/database.duckdb" MLEAGUE_CACHE_DIR="$RUNNER_TEMP/cache" \
            uv run --locked --directory "$RUNNER_TEMP/mcpb" python - <<'EOF'
          import os
          import sys
          sys.path.insert(0, "src")
          import server

          # 取得したクエリ例が同梱版と同じ件数で、最新の DB で EXPLAIN がすべて通るか
          server._download_examples(os.environ["EXAMPLES_SHA"])
          fetched = server._load_examples(server.CACHE_QUERIES)
          bundled = server._load_examples(server.BUNDLED_DOCS / "queries")
          assert fetched.keys() == bundled.keys(), (len(fetched), len(bundled))
          failed = fetched.keys() - server._explainable(fetched)
          assert not failed, failed
          # 取得した SQL を実行しないこと（複数文・EXPLAIN ANALYZE は検証で外す）と、zip の名前で外に書かないこと
          assert not server._explainable({"multi": {"sql": "SELECT 1; SELECT 2"}, "analyze": {"sql": "EXPLAIN ANALYZE SELECT 1"}})
          assert server._safe_child(server.CACHE_QUERIES, "D:evil") is None
          assert server._safe_child(server.CACHE_QUERIES, "..") is None

          assert server.BUNDLED_DOCS.name == "docs", server.BUNDLED_DOCS
          assert server.search_query_examples("連続1着", include_sql=False)
          assert server.get_doc("glossary").startswith("#")
          assert server.get_doc("tables").startswith("#")
          assert server.list_tables()
          assert server.describe_table("game")["columns"]
          assert server.run_sql("SELECT count(*) FROM game")["rows"][0][0] > 0
          assert server.find_player("ささき")
          try:
              server.run_sql("SELECT * FROM read_csv('/etc/hosts')")
          except server.ToolError:
              pass
          else:
              raise AssertionError("外部ファイルの読み込みが拒否されていない")
          print(server.database_info())
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: m-league-db-mcpb
          path: mcp-server/dist/m-league-db.mcpb
          if-no-files-found: error

  # 版ごとのリリース（mcpb-v<X.Y.Z>）を作る。
  # Latest にしない。Latest のリリースは DB として、server.py・CI・validate.py と
  # m-league-score-sheet の日々の DB 作成（前回の DB の取得）が使うため。
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-mcpb
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m-league-db-mcpb

      - name: Create release
        run: |
          version="${GITHUB_REF_NAME#mcpb-v}"
          gh release create "$GITHUB_REF_NAME" m-league-db.mcpb \
            --verify-tag \
            --latest=false \
            --title "Claude Desktop 拡張機能 $version" \
            --notes "Claude Desktop の拡張機能 $version です。導入手順は mcp-server/GUIDE.md を参照してください。"

